[package]
name = "kadr_core"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
earcutr = "0.4"
numpy = "0.30.0"
pollster = "1.0.1"
pyo3 = { version = "0.30.1", features = ["extension-module"] }
wgpu = "30.0.2"

[lib]
name = "kadr_core"
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
