film: {size: [960, 540], fps: 25, duration: 4, background: "#203040"}
layers:
  - {id: bg, type: gradient, stops: [[0, "#102030"], [1, "#405060"]]}
  - {id: m, type: image, src: map.png, size: [500, 300], position: {0: [300, 260], 4: [520, 300]}, rotation: {0: -8, 4: 12}, shadow: {blur: 12, offset: [6, 8]}}
  - {id: m2, type: image, src: map.png, size: [300, 180], position: [700, 140], scale: {0: 0.8, 4: 1.3}, blur: {0: 0, 4: 6}, opacity: 0.8}
  - {id: sq, type: solid, color: "#ff8800", size: [120, 60], position: [160, 420], rotation: {0: 0, 4: 90}}
  - {id: tx, type: text, text: "Пробный ТЕКСТ", font: Arial, size: 54, position: {0: [480, 470], 4: [500, 430]}, rotation: {0: 0, 4: -10}, scale: {0: 1, 4: 1.4}, shadow: true}
  - {id: tl, type: text, text: "left", font: Arial, size: 40, align: left, position: [40, 60]}
  - {id: sh, type: shape, shape: path, d: "M0 0 C60 -80 140 80 200 0", stroke: {color: "#ffffff", width: 6, dash: [12, 8]}, trim: {0: [0, 0], 3: [0, 1]}, position: [620, 380], anchor: [100, 0], rotation: {0: 0, 4: 30}}
  - {id: el, type: shape, shape: ellipse, size: [140, 140], fill: "#ffffff", position: [820, 420]}
  - {id: through, type: image, src: map.png, size: [400, 240], position: [820, 420], matte: {src: el}}
  - id: c
    type: comp
    size: [300, 200]
    position: [200, 120]
    rotation: {0: 0, 4: 20}
    layers:
      - {id: cbg, type: solid, color: "#2266aa", size: [300, 200]}
      - {id: ct, type: text, text: COMP, font: Arial, size: 60}
