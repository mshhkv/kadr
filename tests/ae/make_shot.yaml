# the footage of the AE 46 films: a hand-held shot of a small 3D set, made by Kadr itself (the camera walks to the right
# and shakes) → kadr render tests/ae/make_shot.yaml --gpu -o tests/ae/shot.mp4, then
#   kadr track tests/ae/shot.mp4 --name sign --at 0 --region "…"   and   kadr stabilize tests/ae/shot.mp4
film: {size: [640, 360], fps: 25, duration: 4, background: "#0b0d12"}
layers:
  - id: stage
    type: scene3d
    samples: 6
    scene:
      camera:
        position: "=[-36 + 9 * t + wiggle(2.6, 2.2, 1), 36 + wiggle(3.1, 1.6, 2), 158 - 5 * t + wiggle(1.7, 2, 5)]"
        look_at: "=[4 + wiggle(2.2, 1.6, 3), 38 + wiggle(2.9, 1.3, 4), 0]"
        fov: 34
      lights:
        - {type: spot, position: [-80, 150, 110], target: [0, 10, 0], color: "#ffd2a6", intensity: 62000, angle: 30, penumbra: .8, shadow: true, soft: 9}
        - {type: point, position: [70, 60, -40], color: "#6f9cff", intensity: 9000}
        - {type: sky, color: "#a7acbf", ground: "#3a2415", intensity: .6}
      look: {exposure: 1.05, glow: .25, filmic: .82, vignette: .3, shutter: 0.1}
      nodes:
        - {id: floor, shape: box, size: [400, 4, 300], position: [0, -2, 0], color: "#6e4a34", roughness: .55}
        - {id: wall, shape: box, size: [400, 200, 4], position: [0, 98, -72], color: "#26324f", roughness: .9}
        - {id: frame, shape: box, size: [78, 46, 2], position: [0, 58, -69.5], color: "#d9d4c8", roughness: .6}
        - {id: screen, shape: plane, size: [70, 38], position: [0, 58, -68.2], color: "#0a0c12", roughness: .3}
        - {id: lamp, shape: box, size: [8, 3, 2], position: [-30, 76, -67.5], color: "#000000", emissive: "#ff4fa3", glow: 2}
        - {id: ball, shape: sphere, radius: 13, position: [-44, 13, 30], color: "#ee3124", roughness: .35, clearcoat: .6}
        - {id: tower, position: [66, 0, 16], rotation: [0, 24, 0], children: [
            {shape: rbox, size: [22, 22, 22], radius: 3, position: [0, 11, 0], color: "#35a0c8", roughness: .5},
            {shape: rbox, size: [15, 15, 15], radius: 2, position: [0, 29.5, 0], rotation: [0, 30, 0], color: "#ffd166", roughness: .45},
            {shape: cylinder, radius: 5, height: 16, position: [0, 45, 0], color: "#f6f3ee", roughness: .3}]}
