# a layer drawn by the film's own shader, turned in 3D like any other layer
film: {size: [720, 400], fps: 25, duration: 2, background: "#0c0f14"}
layers:
  - {id: plasma, type: shader, size: [300, 220], position: [200, 200], rotation: {0: -8, 2: 8}, tint: "#35e0c8",
     code: "fn effect(xy: vec2<f32>, p: FxP) -> vec4<f32> { let uv = fx_uv(xy); let v = sin(uv.x * 9.0 + fx_time() * 2.0) + sin(uv.y * 7.0 - fx_time() * 1.3) + sin((uv.x + uv.y) * 6.0); return vec4<f32>(p.tint * (0.5 + 0.25 * v), 1.0); }"}
  - {id: card, type: shader, size: [300, 220], position: [520, 200], rotation_y: {0: -50, 2: 50}, perspective: 700, tint: "#ff7a2e",
     code: "fn effect(xy: vec2<f32>, p: FxP) -> vec4<f32> { let uv = fx_uv(xy); let k = step(0.5, fract(uv.x * 6.0)) * step(0.5, fract(uv.y * 4.0)) + (1.0 - step(0.5, fract(uv.x * 6.0))) * (1.0 - step(0.5, fract(uv.y * 4.0))); return vec4<f32>(mix(vec3<f32>(0.1), p.tint, k), 1.0); }"}
