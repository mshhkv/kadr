# AE 17: Merge Paths (one outline cut from, crossed with, joined to another) and Offset Paths (grown and shrunk)
film: {size: [720, 400], fps: 25, duration: 2, background: "#f3f0e8"}
layers:
  - {id: cut, type: shape, position: [40, 60], fill: "#1e5bd8",
     paths: [{shape: rect, size: [130, 130], radius: 18}, {shape: ellipse, size: [90, 90], at: {0: [90, 90], 2: [20, 20]}, op: subtract}]}
  - {id: cross, type: shape, position: [215, 60], fill: "#e8423a",
     paths: [{shape: ellipse, size: [110, 110]}, {shape: ellipse, size: [110, 110], at: {0: [90, 0], 2: [20, 0]}, op: intersect}]}
  - {id: xor, type: shape, position: [390, 60], fill: "#2f9e62",
     paths: [{shape: rect, size: [100, 100]}, {shape: rect, size: [100, 100], at: {0: [0, 0], 2: [50, 40]}, op: xor}]}
  - {id: badge, type: shape, position: [560, 60], fill: "#111111",
     paths: [{shape: ellipse, size: [130, 130]}, {text: "K", font: Arial, weight: 900, font_size: 110, at: [28, 10], op: subtract}]}
  - {id: grow, type: shape, text: "OFFSET", font: Arial, weight: 900, font_size: 80, position: [60, 250], fill: "#b0123a", offset: {0: -3, 2: 9}}
  - {id: thin, type: shape, position: [470, 250], d: "M0 0 H200 V90 H0 Z", fill: "#ffb000", offset: {0: 24, 2: -30}}
