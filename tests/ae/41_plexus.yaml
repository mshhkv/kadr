# AE 41: Plexus — wandering points, lines between near ones, faces where three are linked; flat, and a cloud turning in 3D
film: {size: [720, 400], fps: 25, duration: 4, background: "#0a0f1a"}
layers:
  - id: flat
    type: plexus
    size: [340, 360]
    position: [185, 200]
    points: {count: 46, drift: [10, 34], size: [3, 6], color: ["#7fd4ff", "#ffffff"]}
    links: {distance: 95, width: 1.1, color: "#7fd4ff", opacity: 0.8, max: 5}
    triangles: {opacity: 0.16, color: "#3d6bff"}
  - id: cloud
    type: plexus
    seed: 4
    size: [300, 300]
    position: [535, 200]
    points: {count: 90, depth: 300, drift: [4, 14], size: [5, 11], color: ["#ffd60a", "#ff8a3d", "#ffffff"], sprite: glow}
    links: {distance: 86, width: 1.3, color: "#ffb35c", opacity: 0.95}
    turn: {0: [12, 0, 0], 4: [12, 150, 0], ease: linear}
    lens: 700
    fade: 0.55
