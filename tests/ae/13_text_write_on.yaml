# AE 13: a title drawn on stroke by stroke (text as outlines + trim), then filled
film: {size: [720, 400], fps: 25, duration: 2, background: "#0e1116"}
layers:
  - {id: fill, type: shape, text: "HELLO", font: Arial, weight: 900, font_size: 150, position: [110, 120], fill: "#ffd60a", opacity: {1.3: 0, 1.9: 1}}
  - {id: line, type: shape, text: "HELLO", font: Arial, weight: 900, font_size: 150, position: [110, 120],
     stroke: {color: "#ffffff", width: 3}, trim: {0: [0, 0], 1.5: {v: [0, 1], ease: inOut}}}
