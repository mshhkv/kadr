     points: {0: [[90, 0], [180, 0], [180, 90], [180, 180], [90, 180], [0, 180], [0, 90], [0, 0]],
              2: [[90, 0], [118, 62], [180, 90], [118, 118], [90, 180], [62, 118], [0, 90], [62, 62]]}, closed: true}
  - {id: heart, type: shape, position: [290, 110], fill: "#e8423a",
     d: {0: "M90 0 C140 0 180 40 180 90 C180 140 140 180 90 180 C40 180 0 140 0 90 C0 40 40 0 90 0 Z",
         2: "M90 50 C90 10 150 -10 170 40 C190 90 130 140 90 180 C50 140 -10 90 10 40 C30 -10 90 10 90 50 Z"}}
